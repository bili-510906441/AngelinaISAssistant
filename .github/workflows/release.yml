name: Release

# 只在推 v* 标签时运行；不再出现“分支推送时 release 任务被跳过”的困惑。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release + patch
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout tags (for previous version)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: release-win-x64
          path: release

      - name: Resolve previous tag
        id: prev
        run: |
          $prev = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ([string]::IsNullOrWhiteSpace($prev)) { $prev = '' }
          "tag=$prev" >> $env:GITHUB_OUTPUT
          Write-Host "previous tag = '$prev'"

      - name: Download previous release
        id: prevzip
        if: steps.prev.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force prev | Out-Null
          gh release download "${{ steps.prev.outputs.tag }}" --pattern "angelina_isa_v*_full.zip" --dir prev 2>$null

          $zip = Get-ChildItem prev -Filter '*_full.zip' -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $zip) {
            Write-Warning '上一个版本没有 full.zip 资产，跳过增量补丁'
            "ok=0" >> $env:GITHUB_OUTPUT
            return
          }

          Expand-Archive $zip.FullName -DestinationPath prev_release -Force
          "ok=1" >> $env:GITHUB_OUTPUT

      - name: Build and verify incremental patch
        if: steps.prevzip.outputs.ok == '1'
        run: |
          $ErrorActionPreference = 'Stop'

          $from = '${{ steps.prev.outputs.tag }}'
          $to = '${{ github.ref_name }}'

          ./version_tools/make_update.ps1 -OldDir prev_release -NewDir release -FromVersion $from -ToVersion $to -OutDir .

          $patch = "angelina_isa_v$($from.TrimStart('v'))_v$($to.TrimStart('v')).aisapatch"
          if (-not (Test-Path $patch)) { throw "未生成补丁：$patch" }

          # 用上一个版本真实应用一次补丁，结果必须与本次 release 完全一致
          Remove-Item patch_verify -Recurse -Force -ErrorAction SilentlyContinue
          & hdiffpatch_v5.1.3_bin_windows64/windows64/hpatchz.exe -s-64m prev_release $patch patch_verify | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '补丁应用失败' }

          function Get-TreeHash([string]$dir) {
            $root = (Resolve-Path $dir).Path
            Get-ChildItem $dir -Recurse -File | ForEach-Object {
              $_.FullName.Substring($root.Length + 1).Replace('\', '/') + '|' + (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            } | Sort-Object
          }

          $diff = Compare-Object (Get-TreeHash 'patch_verify') (Get-TreeHash 'release')

          if ($diff) {
            $diff | Select-Object -First 10 | Format-Table | Out-String | Write-Host
            throw '补丁结果与 release 不一致'
          }

          "PATCH=$patch" >> $env:GITHUB_ENV
          Write-Host "补丁校验通过：$patch"

      - name: Package full update zip
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $zip = "angelina_isa_v${version}_full.zip"

          Compress-Archive -Path release/* -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Set-Content "$zip.sha256.txt" -Encoding ascii

          "ZIP=$zip" >> $env:GITHUB_ENV
          Write-Host "已生成 $zip"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @($env:ZIP, "$($env:ZIP).sha256.txt")

          if ($env:PATCH) { $files += $env:PATCH }

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          }
          else {
            gh release create $tag @files --title $tag --generate-notes
          }

          Write-Host "Release $tag 已发布"
