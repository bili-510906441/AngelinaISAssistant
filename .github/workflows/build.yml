name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    name: Build, test and publish (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show toolchain
        run: |
          dotnet --info
          dotnet --list-runtimes

      - name: Restore
        run: dotnet restore AngelinaISAssistant.csproj -r win-x64

      - name: Build (Release, warnings as errors)
        run: dotnet build AngelinaISAssistant.csproj -c Release -r win-x64 --no-restore -warnaserror

      # 卡死根因：App 构造函数会把 OnStartup 投递到 Dispatcher 队列，SmokeTest
      # 第一次 Pump() 时真的会执行 App.OnStartup（不需要 Application.Run）。
      # CI 上 config 不存在，OnStartup 排队的 ShowConfigNoticeIfAny 会弹出
      # 「悲报：配置文件缺失」模态对话框并一直等用户点确定——本地点掉看起来
      # 正常，CI 没人点就永远卡住（还额外创建了第二个主窗口，所以会看到两个
      # 窗口）。这里在运行前先放一份合法的 settings.json，避免任何配置弹窗；
      # 同时关闭 OCR 后端（AISA_NO_OCR=1），避免无 GPU 的 runner 上做
      # DirectML/OCR 预热。最后仍加超时兜底，防止以后再有模态框卡住 job。
      - name: Smoke test (window shell / resources)
        env:
          AISA_NO_OCR: "1"
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet build auto_test/SmokeTest/SmokeTest.csproj -c Release

          $outDir = Get-ChildItem 'auto_test/SmokeTest/bin/Release' -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'SmokeTest.dll') } |
            Select-Object -First 1

          if (-not $outDir) { throw '未找到 SmokeTest 输出目录' }

          $configDir = Join-Path $outDir.FullName 'config'
          New-Item -ItemType Directory -Force $configDir | Out-Null

          $settingsJson = @'
          {
            "Language": "",
            "UpdatePreference": "Incremental",
            "InferenceGpu": -2,
            "CaptureBackend": "Wgc",
            "HotkeyShowHide": "Ctrl+Shift+Alt+A",
            "LiveAssist": "None",
            "NumberFormat": "Wan",
            "ShowAdvancedSettings": false,
            "SoftwareRendering": false
          }
          '@

          Set-Content -Path (Join-Path $configDir 'settings.json') -Value $settingsJson -Encoding utf8

          # 用 .NET Process 直接启动（Start-Process 取不到可靠的 ExitCode），
          # 输出用异步读取避免管道写满；超时则杀掉整个进程树并打印最后输出。
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = 'dotnet'
          $psi.Arguments = 'run --project auto_test/SmokeTest/SmokeTest.csproj -c Release --no-build'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $proc = [System.Diagnostics.Process]::new()
          $proc.StartInfo = $psi
          $null = $proc.Start()

          $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
          $stderrTask = $proc.StandardError.ReadToEndAsync()
          $timeoutMs = 240000

          if (-not $proc.WaitForExit($timeoutMs)) {
            & taskkill /PID $proc.Id /T /F | Out-Null
            $null = $proc.WaitForExit(5000)
            Write-Host '--- SmokeTest 超时，最后输出 ---'
            if ($stdoutTask.Wait(2000)) { Write-Host $stdoutTask.Result }
            if ($stderrTask.Wait(2000)) { Write-Host $stderrTask.Result }
            throw "SmokeTest 在 $($timeoutMs / 1000) 秒内没有结束（疑似被模态对话框卡住）"
          }

          $null = $proc.WaitForExit()
          if ($stdoutTask.Result) { Write-Host $stdoutTask.Result }
          if ($stderrTask.Result) {
            Write-Host '--- stderr ---'
            Write-Host $stderrTask.Result
          }

          if ($proc.ExitCode -ne 0) { throw "SmokeTest 失败，退出码 $($proc.ExitCode)" }
          Write-Host 'SmokeTest OK'

      - name: Config robustness test (missing / corrupted)
        run: dotnet run --project auto_test/ConfigTest/ConfigTest.csproj -c Release

      - name: Folder patch test (hdiffz + hpatchz)
        run: |
          $ErrorActionPreference = 'Stop'

          $work = Join-Path $env:RUNNER_TEMP 'patchtest'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          $old = Join-Path $work 'old'
          $new = Join-Path $work 'new'
          New-Item -ItemType Directory -Force $old, $new | Out-Null

          Set-Content (Join-Path $old 'keep.txt') 'same' -NoNewline
          Set-Content (Join-Path $new 'keep.txt') 'same' -NoNewline
          Set-Content (Join-Path $old 'a.txt') 'hello v1' -NoNewline
          Set-Content (Join-Path $new 'a.txt') 'hello v2' -NoNewline
          Set-Content (Join-Path $old 'removed.txt') 'bye' -NoNewline
          Set-Content (Join-Path $new 'added.txt') 'new file' -NoNewline

          $bytes = New-Object byte[] 4096
          [Random]::new(42).NextBytes($bytes)
          [System.IO.File]::WriteAllBytes((Join-Path $old 'changed.bin'), $bytes)
          $bytes[0] = 7
          [System.IO.File]::WriteAllBytes((Join-Path $new 'changed.bin'), $bytes)

          ./version_tools/make_update.ps1 `
            -OldDir $old -NewDir $new `
            -FromVersion v0.0.2 -ToVersion v0.0.4 `
            -OutDir $work

          $package = Join-Path $work 'angelina_isa_v0.0.2_v0.0.4.aisapatch'
          if (-not (Test-Path $package)) { throw '增量包未生成' }

          dotnet run --project auto_test/PatchTest/PatchTest.csproj -c Release -- `
            $old $package (Join-Path $work 'stage') `
            'hdiffpatch_v5.1.3_bin_windows64/windows64/hpatchz.exe'

      - name: Publish release folder
        run: ./version_tools/publish_release.ps1 -OutDir release

      - name: Verify release layout
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'release/AngelinaISAssistant.exe',
            'release/AngelinaISAssistant.dll',
            'release/AngelinaISAssistant.runtimeconfig.json',
            'release/DependencySetup_依赖库安装.bat',
            'release/externals/Serilog.dll',
            'release/externals/Vortice.Direct3D11.dll',
            'release/externals/onnxruntime.dll',
            'release/models/ppocr/PP-OCRv6_small_det.onnx',
            'release/models/ppocr/PP-OCRv6_small_rec.onnx',
            'release/models/ppocr/keys.txt',
            'release/tools/hdiffpatch/hpatchz.exe'
          )

          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "缺少发布文件：$item" }
          }

          if (-not (Test-Path 'release/runtime/host/fxr')) { throw '缺少 .NET 运行时目录 runtime/host/fxr' }

          $coreDirs = Get-ChildItem 'release/runtime/shared/Microsoft.NETCore.App' -Directory
          $desktopDirs = Get-ChildItem 'release/runtime/shared/Microsoft.WindowsDesktop.App' -Directory
          $fxrDirs = Get-ChildItem 'release/runtime/host/fxr' -Directory

          if (-not ($coreDirs.Name -match '^10\.') -or -not ($desktopDirs.Name -match '^10\.') -or -not ($fxrDirs.Name -match '^10\.')) {
            throw "运行时版本与 net10 不匹配：core=$($coreDirs.Name) desktop=$($desktopDirs.Name) fxr=$($fxrDirs.Name)"
          }

          # externals 结构：依赖 dll 平铺 + locales\<culture> 卫星资源
          $locales = @('cs', 'de', 'es', 'fr', 'it', 'ja', 'ko', 'pl', 'pt-BR', 'ru', 'tr', 'zh-Hans', 'zh-Hant')
          foreach ($culture in $locales) {
            if (-not (Test-Path "release/externals/locales/$culture")) { throw "缺少 locales/$culture" }
          }

          if (-not (Test-Path 'release/externals/locales/ja/PresentationFramework.resources.dll')) {
            throw 'locales/ja 里没有 WPF 卫星资源'
          }

          if (-not (Test-Path 'release/externals/onnxruntime_LICENSE.txt')) {
            throw '缺少 onnxruntime 许可证'
          }

          $frameworkLocales = Get-ChildItem 'release/runtime/shared/Microsoft.WindowsDesktop.App/*' -Directory |
            Where-Object { $_.Name -match '^[a-z]{2,3}(-[A-Za-z]{2,4})?$' }

          if ($frameworkLocales) { throw "运行时目录里不应再有语言子目录：$($frameworkLocales.Name -join ', ')" }

          $size = [math]::Round(((Get-ChildItem release -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          $count = (Get-ChildItem release -Recurse -File).Count
          Write-Host "release 就绪：$count 个文件，$size MB"

      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-win-x64
          path: release
          if-no-files-found: error
          retention-days: 14
